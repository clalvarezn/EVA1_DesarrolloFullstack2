<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar producto - Admin | LevelUp Gaming</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="admin-header">
    <a class="logo" href="index.html">LEVEL<span>UP</span> ADMIN</a>
  </header>
  <aside class="sidebar">
    <a href="index.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
    <a href="producto-nuevo.html"><i class="bi bi-plus-circle"></i> Nuevo producto</a>
    <a href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
    <a href="usuario-nuevo.html"><i class="bi bi-person-plus"></i> Nuevo usuario</a>
    <a href="../index.html"><i class="bi bi-shop"></i> Ver tienda</a>
  </aside>
  <main class='admin-main'>
    <form id="productoForm" class="form-card shadow-lg">
      <h1>Editar producto</h1>
      <label>Código producto<input class="form-control" type="text" minlength="3" required></label>
      <label>Nombre<input class="form-control" type="text" maxlength="100" required></label>
      <label>Descripción<textarea class="form-control" maxlength="500"></textarea></label>
      <label>Precio<input class="form-control" type="number" min="0" step="0.01" required></label>
      <label>Stock<input class="form-control" id="stock" type="number" min="0" step="1" required></label>
      <label>Stock crítico<input class="form-control" type="number" min="0" step="1" value="3"></label>
      <label>Categoría<select class="form-select" required>
          <option value="">Seleccione</option>
          <option>Periféricos</option>
          <option>Hardware PC</option>
          <option>Sillas Gamer</option>
          <option>Accesorios</option>
        </select></label>
      <label>Imagen<input class="form-control" type="file" accept="image/*"></label>
      <button class="btn" type="submit">Guardar producto</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
