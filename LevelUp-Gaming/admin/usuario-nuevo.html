</aside>
<main class='admin-main'>
<form id="usuarioForm" class="form-card shadow-lg">
<h1>Nuevo usuario</h1>
<label>RUN<input class="form-control" type="text" minlength="7" maxlength="9" required></label>
<label>Nombre<input class="form-control" type="text" maxlength="50" required></label>
<label>Apellidos<input class="form-control" type="text" maxlength="100" required></label>
<label>Correo<input class="form-control" type="email" maxlength="100" required></label>
<label>Fecha de nacimiento<input class="form-control" type="date"></label>
<label>Tipo de usuario<select class="form-select" required><option>Administrador</option><option>Cliente</option><option>Vendedor</option></select></label>
<label>Región<select class="form-select" id="region" required><option>Región Metropolitana</option><option>Valparaíso</option><option>Biobío</option></select></label>
<label>Comuna<select class="form-select" id="comuna" required><option>Puente Alto</option><option>Santiago</option></select></label>
<label>Dirección<textarea class="form-control" maxlength="300" required></textarea></label>
<button class="btn" type="submit">Guardar usuario</button>
</form>
</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
